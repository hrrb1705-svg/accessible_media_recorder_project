name: accessible_media_recorder
description: "اپ ضبط صدا و تصویر دسترس‌پذیر با رابط فارسی"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  record: ^5.1.2
  audioplayers: ^6.1.0
  video_player: ^2.8.3
  file_picker: ^8.0.6
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  ffmpeg_kit_flutter_min: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
