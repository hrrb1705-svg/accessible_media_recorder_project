plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.accessible_media_recorder"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId "com.example.accessible_media_recorder"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file("upload-keystore.jks")
            storeType "pkcs12"
            storePassword "Hamidrezarahimi"
            keyAlias "Hamidrezarahimi"
            keyPassword "Hamidrezarahimi"
        }
    }

    buildTypes {
        release {
            // اگر فایل کلید وجود نداشته باشد، با کلید دیباگ امضا می‌شود تا ساخت خطا ندهد
            signingConfig file("upload-keystore.jks").exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}
