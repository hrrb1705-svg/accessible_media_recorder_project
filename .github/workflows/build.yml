name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
        continue-on-error: true
      - name: Prepare signing files
        env:
          KEYSTORE_B64: ${{ secrets.BNA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.BNA_KS_PASS }}
          KEY_PASS: ${{ secrets.BNA_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.BNA_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KS_PASS"
            echo "keyPassword=$KEY_PASS"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
      - run: flutter build apk --release
      - name: Prepare APK file
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/accessible-media-recorder.apk
      - uses: actions/upload-artifact@v4
        with:
          name: accessible-recorder
          path: dist/accessible-media-recorder.apk
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk --cleanup-tag -y || true
          gh release create latest-apk dist/accessible-media-recorder.apk \
            --title "آخرین نسخه برنامه (ساخت ${{ github.run_number }})" \
            --notes "این نسخه به‌صورت خودکار از آخرین تغییر شاخه main ساخته شده است. فایل accessible-media-recorder.apk را دانلود و نصب کنید." \
            --latest
