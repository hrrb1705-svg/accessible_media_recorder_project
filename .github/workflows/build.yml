name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
        continue-on-error: true
      - run: flutter build apk --release
      - name: Rename APK to a readable Persian name
        run: |
          mkdir -p build/app/outputs/flutter-apk/release-named
          cp "build/app/outputs/flutter-apk/app-release.apk" "build/app/outputs/flutter-apk/release-named/ضبط و ویرایش دسترس‌پذیر.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: accessible-recorder
          path: build/app/outputs/flutter-apk/release-named/
